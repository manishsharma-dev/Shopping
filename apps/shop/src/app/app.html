<div class="shop-shell">
  <header class="topbar">
    <a class="wordmark" routerLink="/home"
      ><span class="brand-symbol" aria-hidden="true">N</span><span>Northstar Market</span></a
    >
    <nav class="nav" aria-label="Storefront">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
    <div class="header-actions">
      <span
        class="cart-pill"
        role="img"
        [attr.aria-label]="'Cart: ' + cart.itemCount() + ' items'"
        [attr.title]="'Cart: ' + cart.itemCount() + ' items'"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 3h2l2.5 12h11l2-8H6" />
          <circle cx="9" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
        </svg>
        <span class="cart-count" aria-hidden="true">{{ cart.itemCount() }}</span> </span
      ><app-theme-toggle />
    </div>
  </header>
  <main class="content" [class.account-content]="router.url.startsWith('/account')">
    <router-outlet />
  </main>
</div>
